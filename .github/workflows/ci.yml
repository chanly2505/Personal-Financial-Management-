# Checks every push and pull request before it can go live (PROD-3,
# docs/production-audit.md). Railway deploys main; turn on "Wait for CI" in
# the Railway service settings so a failing run blocks the deploy.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance" --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; integration tests refuse any name not ending in _test.
      TEST_DATABASE_URL: postgresql://finance:finance@localhost:5432/finance_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types, lint, formatting, unit and integration tests
        run: npm run check
      - name: Production build
        run: npm run build
